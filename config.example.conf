# =============================================================================
# BootShield unattended config
# =============================================================================
# Copy this file, edit it, then run:
#
#     sudo ./distros/ubuntu.sh --config /path/to/server.conf
#
# Every answer the interactive menu would ask for is set here as KEY=VALUE.
# Lines starting with # are ignored. Values with spaces don't need quotes, but
# quotes are stripped if present (handy for SSH public keys). Any key you omit
# falls back to the script's built-in default (shown below).
#
# ORDER OF OPERATIONS: the VPN module runs before the firewall, so if you set
# ENABLE_VPN=yes together with SSH_ACCESS=vpn-only, the VPN interface (wg0, or
# tailscale0 when VPN_MODE=tailscale) is already up when the firewall locks SSH
# to the VPN range. Still — keep your current session open and verify VPN access
# before trusting a vpn-only box.
# =============================================================================

# --- User management -------------------------------------------------------
CONFIGURE_USERS=yes
CREATE_USER=yes
NEW_USERNAME=laurs
CREATE_SUDO_USER=yes          # create the user with sudo (if new)
ADD_SUDO=yes                  # add to sudo group (if user already exists)
ADD_WHEEL=yes                 # RHEL/Rocky/Alma: add to wheel group instead
SETUP_SSH_KEY=yes
SSH_KEY_USER=laurs
SSH_KEY_METHOD=Paste existing public key   # or: Generate new keypair / Skip SSH key setup
SSH_PUBKEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... you@laptop
LOCK_ROOT=yes

# --- SSH hardening ---------------------------------------------------------
SSH_HARDENING=yes
CHANGE_SSH_PORT=no
SSH_PORT=22                   # also used by the firewall rule
DISABLE_PASSWORD_AUTH=yes     # keys only — make sure SSH_PUBKEY is set and tested!
DISABLE_ROOT_LOGIN=yes
SSH_EXTRA_HARDENING=yes       # modern ciphers, forwarding off, etc.
SSH_ALLOWUSERS=yes
SSH_ALLOW_USERS_LIST=laurs
APPLY_SSH=yes
RELOAD_SSH=yes

# --- VPN -------------------------------------------------------------------
ENABLE_VPN=yes                # gate for the VPN module (any mode)
VPN_MODE=wg-server            # wg-server | wg-client | tailscale
#
#   wg-server  this box is the WireGuard hub; clients dial in. Only this mode
#              opens WG_PORT in the firewall.
#   wg-client  this box dials OUT to a WireGuard server you already run.
#   tailscale  join a tailnet (NAT traversal; no inbound port; uses tailscale0).

# -- wg-server mode --
WG_PORT=51820
WG_SUBNET=10.10.10.0/24
WG_SERVER_ADDRESS=10.10.10.1/24
WG_ENDPOINT=                  # ip:port clients dial; blank = auto-detect public IP
WG_CLIENT_NAME=admin
WG_CLIENT_ADDRESS=10.10.10.2/32  # also: this box's tunnel address in wg-client/generate
WG_ALLOWED_IPS=10.10.10.0/24  # split-tunnel (admin plane only); 0.0.0.0/0 = full tunnel

# -- wg-client mode --
WG_CLIENT_SOURCE=file         # file | generate
WG_CLIENT_CONF=/root/wg0.conf # (source=file) path to a .conf exported from your server
WG_PEER_PUBKEY=               # (source=generate) your server's public key
WG_PEER_ENDPOINT=             # (source=generate) your server's host:port
WG_KEEPALIVE=25               # (source=generate) PersistentKeepalive seconds

# -- tailscale mode --
TS_LOGIN_SERVER=              # self-hosted Headscale/control server URL; blank = Tailscale SaaS
TS_AUTHKEY=                   # auth key for unattended join; blank = interactive login URL
                              #   (Headscale: headscale preauthkeys create --user <you>)
TS_HOSTNAME=                  # node name on the tailnet; blank = short hostname
TS_SSH=yes                    # enable Tailscale SSH on this node
TS_ACCEPT_ROUTES=no           # accept subnet routes advertised on the tailnet

# --- Firewall (nftables) ---------------------------------------------------
FIREWALL_ENABLE=yes
DISABLE_UFW=yes               # Debian/Ubuntu: stand down UFW if present (conflicts)
DISABLE_FIREWALLD=yes         # RHEL/Rocky/Alma: stand down firewalld instead
SSH_ACCESS=vpn-only           # anywhere | vpn-only (needs the VPN iface up: wg0, or tailscale0 when VPN_MODE=tailscale)
WEB_ALLOW_FROM=cloudflare     # anywhere | cloudflare | none
MAIL_PORTS=no                 # open 25,465,587,993
EXTRA_TCP_PORTS=              # e.g. 8080,9000
EXTRA_UDP_PORTS=
DOCKER_INTEGRATION=yes        # DOCKER-USER rules so container 80/443 is Cloudflare-only

# --- Fail2ban --------------------------------------------------------------
FAIL2BAN=yes
FAIL2BAN_INSTALL=yes

# --- Kernel hardening ------------------------------------------------------
KERNEL_HARDENING=yes
K_IP_SPOOF=yes
K_ICMP_REDIRECT=yes
K_SRC_ROUTE=yes
K_SYN_FLOOD=yes
K_LOG_MARTIANS=yes
K_IGNORE_BCAST=yes
K_LIMITS=yes
K_SHM=yes

# --- Automatic security updates --------------------------------------------
AUTO_UPDATES=yes
